<!DOCTYPE html>
<html>

<head>
  <title>Flight AI</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 600px;
      margin: auto;
      padding: 20px;
      background: #f5f7fa;
    }

    h1 {
      text-align: center;
    }

    form {
      background: white;
      padding: 20px;
      border-radius: 10px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
    }

    input, button {
      width: 100%;
      padding: 10px;
      margin-top: 10px;
    }

    button {
      background: #007bff;
      color: white;
      border: none;
      border-radius: 5px;
    }

    #result {
      background: white;
      padding: 15px;
      border-radius: 10px;
      margin-top: 20px;
    }
  </style>

</head>
  
<body>
  <h1>✈️ Flight AI</h1>

  <h2>Ingresá tu vuelo</h2>

  <form id="flightForm">
    <label>Origen:</label><br>
    <input type="text" id="origin"><br><br>

    <label>Destino:</label><br>
    <input type="text" id="destination"><br><br>

    <label>Combustible usado (kg):</label><br>
    <input type="number" id="fuel"><br><br>

    <button type="submit">Analizar vuelo</button>
  </form>

  <h2>Resultado:</h2>
  <p id="result">---</p>

  <h2>Historial de vuelos</h2>
  <ul id="history"></ul>
  
  <script>
  let history = [];

  document.getElementById("flightForm").addEventListener("submit", async function(e) {
    e.preventDefault();

    let origin = document.getElementById("origin").value;
    let destination = document.getElementById("destination").value;
    let fuel = document.getElementById("fuel").value;

    document.getElementById("result").innerText = "Analizando con IA...";

    const response = await fetch("/api/analyze", {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({ origin, destination, fuel })
    });

    const data = await response.json();

    document.getElementById("result").innerText = data.result;

    // guardar en historial (local)
    history.push(`${origin} → ${destination} (${fuel} kg)`);

    const list = document.getElementById("history");
    list.innerHTML = "";

    history.forEach(item => {
      let li = document.createElement("li");
      li.innerText = item;
      list.appendChild(li);
    });
  });
</script>
  
</body>
</html>
