<!DOCTYPE html>
<html>
<head>
  <title>Flight AI</title>

  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, sans-serif;
      background: #0f172a;
      color: white;
      margin: 0;
      padding: 20px;
    }

    .container {
      max-width: 600px;
      margin: auto;
    }

    h1 {
      text-align: center;
      margin-bottom: 10px;
    }

    .subtitle {
      text-align: center;
      color: #94a3b8;
      margin-bottom: 30px;
    }

    .card {
      background: #1e293b;
      padding: 20px;
      border-radius: 12px;
      margin-bottom: 20px;
    }

    input {
      width: 100%;
      padding: 12px;
      margin-top: 10px;
      margin-bottom: 15px;
      border-radius: 8px;
      border: none;
      background: #0f172a;
      color: white;
    }

    button {
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: 8px;
      background: #3b82f6;
      color: white;
      font-weight: bold;
      cursor: pointer;
    }

    .result {
      background: #1e293b;
      padding: 20px;
      border-radius: 12px;
    }

    .status {
      font-size: 28px;
      font-weight: bold;
    }

    .green { color: #22c55e; }
    .red { color: #ef4444; }
  </style>
</head>

<body>

<div class="container">

  <h1>✈️ Flight AI</h1>
  <div class="subtitle">Optimización inteligente de vuelos</div>

  <div class="card">
    <form id="flightForm">
      <input type="text" id="origin" placeholder="Origen (ej: BUE)">
      <input type="text" id="destination" placeholder="Destino (ej: MIA)">
      <input type="text" id="aircraft" placeholder="Avión (ej: B737-800)">
      <input type="number" id="fuel" placeholder="Combustible (kg)">

      <button type="submit">Analizar vuelo</button>
    </form>
  </div>

  <div id="result"></div>

</div>

<script>
document.getElementById("flightForm").addEventListener("submit", async function(e) {
  e.preventDefault();

  let origin = document.getElementById("origin").value;
  let destination = document.getElementById("destination").value;
  let fuel = document.getElementById("fuel").value;
  let aircraft = document.getElementById("aircraft").value;

  const resultBox = document.getElementById("result");
  resultBox.innerHTML = "⏳ Analizando...";

  try {
    const response = await fetch("/api/analyze", {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({ origin, destination, fuel, aircraft })
    });

    const data = await response.json();

    const lines = data.result.split("\n");

    let estado = lines[0]?.replace("Estado:", "").trim();
    let motivo = lines[1]?.replace("Motivo:", "").trim();
    let mejora = lines[2]?.replace("Mejora:", "").trim();

    let colorClass = estado === "Eficiente" ? "green" : "red";

    resultBox.innerHTML = `
      <div class="result">
        <div class="status ${colorClass}">${estado}</div>
        <p><strong>Motivo:</strong> ${motivo}</p>
        <p><strong>Mejora:</strong> ${mejora}</p>
      </div>
    `;

  } catch (error) {
    resultBox.innerHTML = "❌ Error";
  }
});
</script>

</body>
</html>
